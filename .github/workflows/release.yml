name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-aarch64
            runner: blacksmith-6vcpu-macos-15
            shell: bash
            command: ./scripts/bundle-mac aarch64-apple-darwin

          - name: macos-x86_64
            runner: blacksmith-6vcpu-macos-15
            shell: bash
            command: ./scripts/bundle-mac x86_64-apple-darwin

          - name: linux-x86_64
            runner: blacksmith-4vcpu-ubuntu-2404
            shell: bash
            command: ./scripts/bundle-linux x86_64-unknown-linux-gnu

          - name: windows-x86_64
            runner: blacksmith-4vcpu-windows-2025
            shell: pwsh
            command: ./scripts/bundle-windows.ps1 -Architecture x86_64

          - name: windows-aarch64
            runner: blacksmith-4vcpu-windows-2025
            shell: pwsh
            command: ./scripts/bundle-windows.ps1 -Architecture aarch64

          - name: linux-aarch64
            runner: blacksmith-4vcpu-ubuntu-2404-arm
            shell: bash
            command: ./scripts/bundle-linux aarch64-unknown-linux-gnu

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install ARM64 MSVC tools
        if: matrix.name == 'windows-aarch64'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          if (-not (Test-Path $installer)) {
            Write-Host "vs_installer.exe not found at $installer"
            Write-Host "Searching for it..."
            $installer = Get-ChildItem -Path "C:\" -Recurse -Filter "vs_installer.exe" -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
            if (-not $installer) {
              throw "Could not find vs_installer.exe"
            }
          }

          $installPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath -format value 2>$null

          if (-not $installPath) {
            $installPath = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022\BuildTools"
          }

          Write-Host "Installer: $installer"
          Write-Host "Install path: $installPath"

          $proc = Start-Process -FilePath $installer -ArgumentList @(
            "modify",
            "--installPath", "`"$installPath`"",
            "--quiet", "--norestart", "--nocache",
            "--add", "Microsoft.VisualStudio.Workload.VCTools",
            "--add", "Microsoft.VisualStudio.Component.VC.14.44.17.14.ARM64",
            "--add", "Microsoft.VisualStudio.Component.Windows11SDK.26100"
          ) -Wait -PassThru -NoNewWindow

          Write-Host "Installer exit code: $($proc.ExitCode)"

          if ($proc.ExitCode -ne 0 -and $proc.ExitCode -ne 3010) {
            throw "VS Installer failed with exit code $($proc.ExitCode)"
          }

      - name: Install LLVM for ARM64 assembly
        if: matrix.name == 'windows-aarch64'
        shell: pwsh
        run: |
          choco install llvm -y
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "C:\Program Files\LLVM\bin\clang.exe" --version

      - name: Add Rust ARM64 target
        if: matrix.name == 'windows-aarch64'
        shell: pwsh
        run: rustup target add aarch64-pc-windows-msvc

      - name: Bundle
        if: matrix.shell == 'bash'
        shell: bash
        run: ${{ matrix.command }}

      - name: Bundle
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: ${{ matrix.command }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: target/dist/*
          if-no-files-found: error

  release:
    needs: bundle
    runs-on: blacksmith-2vcpu-ubuntu-2404

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
