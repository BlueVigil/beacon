[build]
incremental = true

[env]
CPATH                    = { force = true, value = "" }
LIBRARY_PATH             = { force = true, value = "" }
MACOSX_DEPLOYMENT_TARGET = "14.0"
SDKROOT                  = "/Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk"

# macOS (Apple Silicon)
[target.aarch64-apple-darwin]
linker = "/Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/clang"
rustflags = [
  "-C", "link-arg=-isysroot",
  "-C", "link-arg=/Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk",
  "-L", "native=/Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk/usr/lib",
]

# macOS (Intel)
[target.x86_64-apple-darwin]
linker = "/Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/clang"
rustflags = [
  "-C", "link-arg=-isysroot",
  "-C", "link-arg=/Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk",
  "-L", "native=/Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk/usr/lib",
]

# Linux (x86_64)
[target.x86_64-unknown-linux-gnu]
linker = "x86_64-linux-gnu-gcc"

# Linux (ARM64)
[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"

# Windows (x86_64) — requires llvm or mingw when building from macOS/Linux
[target.x86_64-pc-windows-msvc]
# Uses MSVC linker; typically built on Windows or with llvm/lld cross toolchain.

[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"

# Windows (ARM64)
[target.aarch64-pc-windows-msvc]
# Uses MSVC linker; typically built on Windows or with llvm/lld cross toolchain.
